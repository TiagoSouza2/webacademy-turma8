<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
</head>

<body>
    <div id="organizador">
        <h3>Tarefas Pendentes:</h3>
        <ul id="lista-pendentes">
            <li id="tarefa-carro">Lavar o carro</li>
            <li id="tarefa-js">Estudar JavaScript</li>
            <li id="tarefa-livro">Ler livro</li>
            <li id="tarefa-roupas">Dobrar as roupas</li>
        </ul>

        <h3>Tarefas Concluídas:</h3>
        <ul id="lista-concluidas">
            <li>Fazer compras</li>
        </ul>
    </div>
    <script>
        const listaPendentes = document.querySelector("#lista-pendentes")
        const listaConcluidas = document.querySelector("#lista-concluidas")
        const filhosListaPendentes = listaPendentes.children

        // Passo 1: removendo o primeiro filho
        filhosListaPendentes[0].remove()

        // Passo 2: Alerando elemento de lista
        listaConcluidas.appendChild(filhosListaPendentes[0])

        // Passo 3: Criando elemento e adicionando no adjacente
        let fazerExercicio = document.createElement("li")
        fazerExercicio.innerHTML = "Fazer Exercício"

        filhosListaPendentes[0].insertAdjacentElement("afterend", fazerExercicio)

        // Passo 4 Adicionando conteudo a elemnto da lista
        filhosListaPendentes[0].textContent = "[URGENTE] " + filhosListaPendentes[0].textContent
        
    </script>
</body>

</html>
