<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Carrinho de Compras
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <main>

        <h1>
            Carrinho de Compras
        </h1>


        <!-- ESTATÍSTICAS -->

        <section id="cartStatistics">

            <h2>
                Carrinho
            </h2>

            <p>
                Quantidade de produtos:

                <strong id="productCount">
                    0
                </strong>
            </p>


            <p>
                Valor total:

                <strong id="cartTotal">
                    R$ 0,00
                </strong>
            </p>

        </section>


        <hr>


        <h2>
            Adicionar produto
        </h2>


        <form id="productForm">


            <div>

                <label for="productType">
                    Tipo de produto
                </label>

                <select
                    id="productType"
                    required
                >

                    <option value="tv">
                        TV
                    </option>

                    <option value="celular">
                        Celular
                    </option>

                    <option value="bicicleta">
                        Bicicleta
                    </option>

                </select>

            </div>


            <!-- CAMPOS COMUNS -->

            <div>

                <label for="model">
                    Modelo
                </label>

                <input
                    type="text"
                    id="model"
                    required
                >

            </div>


            <div>

                <label for="manufacturer">
                    Fabricante
                </label>

                <input
                    type="text"
                    id="manufacturer"
                    required
                >

            </div>


            <div>

                <label for="value">
                    Valor
                </label>

                <input
                    type="number"
                    id="value"
                    min="0.01"
                    step="0.01"
                    required
                >

            </div>


            <!-- CAMPOS DA TV -->

            <section id="tvFields">

                <div>

                    <label for="resolution">
                        Resolução
                    </label>

                    <input
                        type="text"
                        id="resolution"
                        placeholder="Ex: 4K"
                    >

                </div>


                <div>

                    <label for="inches">
                        Tamanho em polegadas
                    </label>

                    <input
                        type="number"
                        id="inches"
                        min="1"
                    >

                </div>

            </section>


            <!-- CAMPOS DO CELULAR -->

            <section
                id="cellphoneFields"
                hidden
            >

                <div>

                    <label for="memory">
                        Memória (GB)
                    </label>

                    <input
                        type="number"
                        id="memory"
                        min="1"
                    >

                </div>

            </section>


            <!-- CAMPOS DA BICICLETA -->

            <section
                id="bikeFields"
                hidden
            >

                <div>

                    <label for="rimSize">
                        Tamanho do aro
                    </label>

                    <input
                        type="number"
                        id="rimSize"
                        min="1"
                    >

                </div>

            </section>


            <button type="submit">
                Adicionar ao carrinho
            </button>

        </form>


        <hr>


        <h2>
            Produtos no carrinho
        </h2>


        <div id="productsList">

        </div>

    </main>


    <script
        type="module"
        src="./dist/main.js"
    ></script>

</body>

</html>
