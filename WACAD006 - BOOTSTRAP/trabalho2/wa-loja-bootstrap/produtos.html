<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loja WA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <!-- navbar -->
    <!-- navbar -->

    <!-- gerenciar produtos -->
    <!-- gerenciar produtos -->

    <!-- modal cadastrar produtos -->
    <!-- cadastro -->
     <main class="container">
      <P>
        Gerenciar Produtos
      </P>
      <div class="d-flex flex-row-reverse">
        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#menuModal">Novo Produto</button>
      </div>
      <!-- Modal -->
      <div class="modal fade" id="menuModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="staticBackdropLabel">Novo Produto</h1>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <label for="prod-cadastro" class="prod-cadastro h6">Produto</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="prod-cadastro" aria-describedby="basic-addon3 basic-addon4">
              </div>

              <label for="prod-cadastro" class="preco-cadastro h6">Preço</label>
              <div class="input-group ">
                  <input type="text" class="form-control" id="preco-cadastro" aria-describedby="basic-addon3 basic-addon4">
              </div>

              <label for="prod-cadastro" class="estoque-cadastro h6 ">Estoque</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="estoque-cadastro" aria-describedby="basic-addon3 basic-addon4">
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-primary  w-100">Confirmar cadastro</button>
            </div>
          </div>
        </div>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Produto</th>
            <th scope="col">Preço</th>
            <th scope="col">Estoque</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">1</th>
            <td>Bicicleta</td>
            <td>R$ 100</td>
            <td>110</td>
            <td>
              <button type="button" class="btn btn-secondary">Editar</button>
              <button type="button" class="btn btn-secondary">Esxcluir</button>
            </td>
          </tr>
          <tr>
            <th scope="row">2</th>
            <td>Celular</td>
            <td>R$ 100</td>
            <td>8</td>
            <td>
              <button type="button" class="btn btn-secondary">Editar</button>
              <button type="button" class="btn btn-secondary">Excluir</button>
            </td>
          </tr>
          <tr>
            <th scope="row">3</th>
            <td>Umificador</td>
            <td>R$ 100</td>
            <td>7</td>
            <td>
              <button type="button" class="btn btn-secondary">Editar</button>
              <button type="button" class="btn btn-secondary">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
     </main>
    <!-- modal cadastrar produtos -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
